name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 22+: the test suite is selected with a glob, which the test runner
      # only supports from 22 on.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # esbuild strips types without checking them, so nothing else catches a
      # type error.
      - run: npm run typecheck

      - run: npm test
