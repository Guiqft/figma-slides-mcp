name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Node 22+: the `npm install -g npm@latest` below needs it. npm 12 dropped
      # Node 20 (engines ^22.22.2 || ^24.15.0 || >=26.0.0).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build:mcp

      - name: Zip Figma plugin
        run: cd mcp/dist/figma-plugin && zip -r ../../../figma-plugin.zip .

      - run: npm publish --access public --provenance

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: figma-plugin.zip
