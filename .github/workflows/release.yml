name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Node 22+: the test runner selects the suite with a glob, supported from
      # 22 on.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The runner's bundled npm predates OIDC trusted publishing, so it has to
      # be upgraded. Pinned to the 11 line rather than @latest: chasing @latest
      # ties releases to npm's engine churn, and npm 12 dropping Node 20 already
      # broke this job once.
      - run: npm install -g npm@11

      - run: npm ci

      - run: npm run build:mcp

      # A tag can otherwise publish without ever running the suite — ci.yml only
      # covers pull requests and pushes to main.
      - run: npm test

      - name: Zip Figma plugin
        run: cd mcp/dist/figma-plugin && zip -r ../../../figma-plugin.zip .

      - run: npm publish --access public --provenance

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: figma-plugin.zip
