<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: Inter, system-ui, sans-serif;
        font-size: 12px;
        padding: 8px;
        color: #333;
        margin: 0;
      }
      #status {
        padding: 4px 8px;
        border-radius: 4px;
        background: #f5f5f5;
      }
      .connected { color: #0a0; }
      .disconnected { color: #a00; }
    </style>
  </head>
  <body>
    <div id="status" class="disconnected">Connecting to MCP server...</div>
    <script>
      const WS_URL = "ws://localhost:3055";
      const PROTOCOL = 1;
      const RETRY_MS = 500;

      let ws = null;
      let identity = null;
      const statusEl = document.getElementById("status");

      function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = cls;
      }

      function connect() {
        if (!identity) return;
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

        ws = new WebSocket(WS_URL);

        ws.onopen = () => {
          setStatus("Connected — " + identity.docName, "connected");
          ws.send(
            JSON.stringify({
              type: "hello",
              role: "plugin",
              protocol: PROTOCOL,
              docName: identity.docName,
              editorType: identity.editorType,
            })
          );
        };

        ws.onmessage = (event) => {
          let msg;
          try {
            msg = JSON.parse(event.data);
          } catch (e) {
            return;
          }
          if (msg && msg.type === "error" && msg.code === "protocol_mismatch") {
            setStatus("Broker version mismatch — update figma-slides-mcp", "disconnected");
            return;
          }
          if (!msg || !msg.id || !msg.command) return;
          parent.postMessage({ pluginMessage: msg }, "*");
        };

        ws.onclose = () => {
          setStatus("Disconnected — reconnecting...", "disconnected");
          ws = null;
          setTimeout(connect, RETRY_MS);
        };

        ws.onerror = () => {
          // onclose fires after this and owns the retry.
        };
      }

      window.onmessage = (event) => {
        const msg = event.data && event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === "identity") {
          identity = { docName: msg.docName, editorType: msg.editorType };
          connect();
          return;
        }
        if (msg.type === "tick") {
          connect();
          return;
        }
        if (!msg.id) return;
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
      };

      parent.postMessage({ pluginMessage: { type: "ui-ready" } }, "*");
    </script>
  </body>
</html>
